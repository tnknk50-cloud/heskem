<title>הסכם התקשרות · Cut it by Amalmal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one column, the PDF header as the opening image, terms as a document, form at the end */
:root{
  --bg:#DEDEDE;        /* the PDF's grey */
  --paper:#F2F2F2;
  --ink:#141414;
  --ink-2:#4A4A4A;
  --red:#B5341C;       /* heading + lines in the PDF */
  --red-2:#8E2814;
  --line:#B5341C;
  --ok:#1F6E3D;
  --font:"Heebo",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hero{max-width:720px;margin:0 auto}
.hero img{width:100%;height:auto}

.course{font-size:14px;color:var(--red);font-weight:700;letter-spacing:.02em;margin:-8px 0 20px;text-align:center}

/* terms */
.terms{background:var(--paper);padding:28px 22px 24px;margin:0 0 26px}
.terms h2{font-weight:900;font-size:22px;color:var(--red);line-height:1.25;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--red);text-wrap:balance}
.terms h3{font-weight:700;font-size:16px;margin:16px 0 4px}
.terms p,.terms li{font-size:15px;color:var(--ink);line-height:1.65}
.terms ul{list-style:none;padding-inline-start:0}
.terms li{padding-inline-start:16px;position:relative;margin:4px 0}
.terms li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:8px;height:2px;background:var(--red)}

/* form, PDF style: label + red underline */
.form{padding:6px 0 40px}
.field{margin:0 0 22px}
.field label{display:block;font-weight:700;font-size:17px;margin-bottom:2px}
.field input{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;font:inherit;font-size:18px;padding:8px 2px;color:var(--ink);border-radius:0;outline:none}
.field input:focus{border-bottom-color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media(max-width:520px){.row{grid-template-columns:1fr}}

.agree{display:flex;gap:12px;align-items:flex-start;font-size:16px;margin:8px 0 22px;cursor:pointer}
.agree input{width:22px;height:22px;flex:0 0 auto;margin-top:3px;accent-color:var(--red)}

.sig label{display:block;font-weight:700;font-size:17px;margin-bottom:6px}
.sigbox{position:relative;background:var(--paper);border:2px solid var(--line);height:190px;touch-action:none;overflow:hidden}
.sigbox canvas{width:100%;height:100%;display:block;cursor:crosshair}
.sigbox .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:15px;pointer-events:none}
.sigbox.has .hint{display:none}
.sigtools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;color:var(--ink-2)}
.sigtools button{background:none;border:0;color:var(--red);font:inherit;font-weight:700;cursor:pointer;padding:4px 0}

.btn{display:block;width:100%;margin-top:26px;padding:18px;background:var(--red);color:#fff;border:0;font:inherit;font-weight:700;font-size:19px;cursor:pointer}
.btn:hover{background:var(--red-2)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:15px;min-height:1.4em;margin-top:12px;font-weight:500}

/* success */
.done{display:none;text-align:center;padding:40px 0 60px}
.done.on{display:block}
.done .check{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:40px;line-height:72px;margin:0 auto 18px}
.done h2{font-weight:900;font-size:28px;margin-bottom:8px}
.done p{color:var(--ink-2);font-size:16px;max-width:36ch;margin:0 auto}
.done .sum{margin:22px auto 0;max-width:360px;text-align:right;font-size:15px;background:var(--paper);padding:16px 18px}
.done .sum div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.08)}
.done .sum div:last-child{border:0}
.done .sum img{height:60px;width:auto;margin-inline-start:auto}
.done .btn{max-width:360px;margin:22px auto 0}

footer{text-align:center;font-size:13px;color:var(--ink-2);padding:0 0 36px}

@media print{
  body{background:#fff}
  .form,.sigtools,.btn,.course{display:none !important}
  .done{display:block !important}
  .terms{background:#fff;padding:0}
}
</style>
</head>

/* date line */
function ilNow(){
  return new Intl.DateTimeFormat("he-IL",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date());
}
document.getElementById("dateline").textContent = "תאריך: " + ilNow();

/* signature pad */
var box = document.getElementById("sigbox"), canvas = document.getElementById("pad"), ctx = canvas.getContext("2d");
var drawing=false, hasInk=false, last=null;
function fit(){
  var r = box.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  var keep = hasInk ? canvas.toDataURL() : null;
  canvas.width = Math.round(r.width*dpr); canvas.height = Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#141414";
  if (keep){ var im=new Image(); im.onload=function(){ ctx.drawImage(im,0,0,r.width,r.height); }; im.src=keep; }
}
fit(); window.addEventListener("resize", fit);
function pos(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
canvas.addEventListener("pointerdown", function(e){ e.preventDefault(); canvas.setPointerCapture(e.pointerId); drawing=true; last=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(last.x+0.1,last.y+0.1); ctx.stroke(); hasInk=true; box.classList.add("has"); });
canvas.addEventListener("pointermove", function(e){ if(!drawing) return; e.preventDefault(); var p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
function stop(){ drawing=false; }
canvas.addEventListener("pointerup", stop); canvas.addEventListener("pointercancel", stop); canvas.addEventListener("pointerleave", stop);
document.getElementById("clear").addEventListener("click", function(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; box.classList.remove("has"); });

/* submit */
var form = document.getElementById("form"), err = document.getElementById("err"), btn = document.getElementById("submit");
